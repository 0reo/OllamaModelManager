<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Model Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2.4.2/dist/deepChat.bundle.js"
            integrity="sha384-ire02ARbuqxh1f0vqLCtjJKh6BVWbziZzoiPht9u+EwKaLagZ6ESBXsXp+A8+x6m"
            crossorigin="anonymous"></script>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span id="themeIcon">🌞</span>
    </button>

    <a href="/swagger.html" class="api-docs-link" title="API Documentation" target="_blank">
        API Docs
    </a>

    <div class="container">
        <h1>Ollama Model Manager</h1>
        
        <div class="endpoint-section">
            <h2>Ollama Endpoints</h2>
            <div class="endpoint-container">
                <div class="endpoint-select-wrapper">
                    <select id="endpointInput" class="endpoint-select" onchange="setEndpoint()">
                        <option value="">Loading endpoints...</option>
                    </select>
                    <div id="endpointStatus"></div>
                </div>
                <div class="running-models-stats">
                    <h3>Running Models</h3>
                    <div id="runningModelsContent"></div>
                </div>
            </div>
        </div>

        <div class="chat-section">
            <h2>Chat</h2>
            <div class="chat-controls">
                <label for="chatModelSelect">Model:</label>
                <select id="chatModelSelect" class="endpoint-select"></select>
            </div>
            <deep-chat id="chatBox" style="display:block;width:100%;height:460px;border-radius:8px;border:unset;background-color:#1e1e1e"></deep-chat>
        </div>

        <div class="models-section">
            <div class="model-pull-container" style="margin-bottom: 24px;">
                <input type="text" id="modelPullInput" placeholder="Enter model name to pull..." class="filter-input" style="width: auto; margin-right: 12px; display: inline-block;">
                <button onclick="pullModel()" class="pull-btn">Pull Model</button>
                <div id="pullStatus" style="margin-top: 12px;"></div>
                <div id="pullProgressText" class="progress-text" style="display: none;"></div>
            </div>
            <h2>Available Models</h2>
            <button onclick="refreshModels()">Refresh Models</button>
            <button onclick="updateSelectedModels(event)" id="updateSelectedBtn" disabled>Update Selected</button>
            <button onclick="deleteSelectedModels(event)" class="delete-btn">Delete Selected</button>
            <div class="filter-container">
                <input type="text" id="modelFilter" placeholder="Filter models..." onkeyup="filterModels()" class="filter-input">
            </div>

            <dialog id="model-details">
                <div id="model-details-wrapper">This dialog shows extended model information.</div>
                <button commandfor="model-details" command="close">Close</button>
            </dialog>            
            <div class="models-list" id="modelsList">
                <div class="models-header">
                    <div class="checkbox-col">
                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleAllModels(this)">
                    </div>
                    <div class="name-col sort-indicator" onclick="sortModels('name')">Name</div>
                    <div class="size-col sort-indicator" onclick="sortModels('size')">Size</div>
                    <div class="param-col sort-indicator" onclick="sortModels('parameter_size')">Params</div>
                    <div class="family-col sort-indicator" onclick="sortModels('family')">Family</div>
                    <div class="capabilities-col sort-indicator" onclick="sortModels('capabilities')">Capabilities</div>
                    <div class="quant-col sort-indicator" onclick="sortModels('quantization_level')">Q-Level</div>
                    <div class="actions-col">Actions</div>
                </div>
                <div id="modelsListContent"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedModels = new Set();
        let currentModels = [];
        let currentSort = { field: 'name', direction: 'asc' };

        // Theme handling
        const toggleTheme = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'dark' ? '🌞' : '🌙';
            localStorage.setItem('theme', newTheme);
        };

        // Initialize theme
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        document.getElementById('themeIcon').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '🌞' : '🌙';

        // Load endpoints from server
        async function loadEndpoints() {
            try {
                const response = await fetch('/api/endpoints');
                const endpoints = await response.json();
                const select = document.getElementById('endpointInput');
                
                // Get last used endpoint from localStorage or use first endpoint
                const lastEndpoint = localStorage.getItem('lastEndpoint') || endpoints[0];

                // Build options via createElement (value/textContent) — never innerHTML — so an
                // endpoint string can't inject markup.
                select.replaceChildren(...endpoints.map(endpoint => {
                    const opt = document.createElement('option');
                    opt.value = endpoint;
                    opt.textContent = endpoint;
                    if (endpoint === lastEndpoint) opt.selected = true;
                    return opt;
                }));

                // Connect to the selected endpoint
                if (lastEndpoint) {
                    setEndpoint();
                }
            } catch (error) {
                console.error('Failed to load endpoints:', error);
                const select = document.getElementById('endpointInput');
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'Failed to load endpoints';
                select.replaceChildren(opt);
            }
        }

        function formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let size = bytes;
            let unitIndex = 0;
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            return `${size.toFixed(2)} ${units[unitIndex]}`;
        }

        async function setEndpoint() {
            const endpoint = document.getElementById('endpointInput').value.trim();
            const statusDiv = document.getElementById('endpointStatus');
            
            try {
                const response = await fetch('/api/set-endpoint', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ endpoint })
                });
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'success';
                    statusDiv.textContent = 'Connected successfully!';
                    localStorage.setItem('lastEndpoint', endpoint);
                    refreshModels();
                    fetchRunningModels();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = `Connection failed: ${error.message}`;
            }
        }

        function sortModels(field) {
            const headers = document.querySelectorAll('.models-header > div');
            headers.forEach(header => {
                header.classList.remove('sort-asc', 'sort-desc');
            });

            if (currentSort.field === field) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = field;
                currentSort.direction = 'asc';
            }

            const header = document.querySelector(`.${field}-col`);
            if (header) {
                header.classList.add(`sort-${currentSort.direction}`);
            }

            displayModels(currentModels);
        }

        function compareValues(a, b, field) {
            let valueA = a;
            let valueB = b;

            if (field === 'size') {
                return a - b;
            }
            
            if (field === 'parameter_size') {
                valueA = parseFloat(a?.replace('B', '')) || 0;
                valueB = parseFloat(b?.replace('B', '')) || 0;
                return valueA - valueB;
            }

            valueA = (valueA || '').toString().toLowerCase();
            valueB = (valueB || '').toString().toLowerCase();
            return valueA.localeCompare(valueB);
        }

        function filterModels() {
            const filterValue = document.getElementById('modelFilter').value.toLowerCase();
            const filteredModels = currentModels.filter(model => 
                model.name.toLowerCase().includes(filterValue) || 
                model.capabilities?.toString().toLowerCase().includes(filterValue)
            );
            displayModels(filteredModels);
        }

        // ---- Safe DOM helpers (avoid innerHTML so crafted model metadata can't inject markup/JS) ----
        function el(tag, className) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            return node;
        }

        // Build a model-name node that line-breaks before the final path segment — the same
        // intent as the old `name.replace(/\/(?=[^/]*$)/, '/<wbr />')` but via real text nodes
        // and a <wbr> element, so a name like `evil"><img onerror=...>` stays inert text.
        function buildNameNode(name) {
            const frag = document.createDocumentFragment();
            const lastSlash = name.lastIndexOf('/');
            if (lastSlash !== -1) {
                frag.appendChild(document.createTextNode(name.slice(0, lastSlash + 1)));
                frag.appendChild(document.createElement('wbr'));
                frag.appendChild(document.createTextNode(name.slice(lastSlash + 1)));
            } else {
                frag.appendChild(document.createTextNode(name));
            }
            return frag;
        }

        // A labeled table cell. The data-label drives the per-model card layout on mobile
        // (CSS renders it via ::before). Empty optional cells are flagged so they collapse on mobile.
        function labeledCell(className, label, text) {
            const cell = el('div', className);
            cell.setAttribute('data-label', label);
            const value = text == null ? '' : String(text);
            cell.textContent = value;
            if (!value) cell.classList.add('is-empty');
            return cell;
        }

        function buildModelRow(model) {
            const row = el('div', 'model-item');
            row.addEventListener('click', () => printModel(model));

            const checkboxCol = el('div', 'checkbox-col');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = model.name; // property assignment — never parsed as HTML
            checkbox.addEventListener('change', () => toggleModel(model.name));
            // Toggling selection shouldn't also open the details dialog.
            checkbox.addEventListener('click', (e) => e.stopPropagation());
            checkboxCol.appendChild(checkbox);

            const nameCol = el('div', 'name-col');
            nameCol.setAttribute('data-label', 'Name');
            nameCol.appendChild(buildNameNode(model.name));

            const capabilities = Array.isArray(model.capabilities) ? model.capabilities.join(', ') : '';

            const actionsCol = el('div', 'actions-col');
            actionsCol.setAttribute('data-label', 'Actions');
            const actionButtons = el('div', 'action-buttons');
            const updateBtn = el('button', 'update-btn');
            updateBtn.type = 'button';
            updateBtn.textContent = 'U';
            updateBtn.title = 'Update model';
            updateBtn.addEventListener('click', (e) => updateModel(e, model.name));
            const deleteBtn = el('button', 'delete-btn');
            deleteBtn.type = 'button';
            deleteBtn.textContent = 'D';
            deleteBtn.title = 'Delete model';
            deleteBtn.addEventListener('click', (e) => deleteModel(e, model.name));
            actionButtons.append(updateBtn, deleteBtn);
            const statusEl = el('div', 'update-status');
            statusEl.id = `status-${model.name}`;
            actionsCol.append(actionButtons, statusEl);

            const tagsValue = Array.isArray(model.tags) ? model.tags.join(', ') : (model.tags || '');
            const tags = el('div', 'tags');
            tags.id = `tags-${model.name}`;
            if (tagsValue) tags.textContent = 'Tags: ' + tagsValue;

            row.append(
                checkboxCol,
                nameCol,
                labeledCell('size-col', 'Size', formatSize(model.size)),
                labeledCell('param-col', 'Params', model.details?.parameter_size || ''),
                labeledCell('family-col', 'Family', model.details?.family || ''),
                labeledCell('capabilities-col', 'Capabilities', capabilities),
                labeledCell('quant-col', 'Q-Level', model.details?.quantization_level || ''),
                actionsCol,
                tags
            );
            return row;
        }

        function displayModels(models) {
            const modelsListContent = document.getElementById('modelsListContent');

            // Sort models
            const sortedModels = [...models].sort((a, b) => {
                let valueA = currentSort.field === 'name' ? a[currentSort.field] :
                            currentSort.field === 'size' ? a[currentSort.field] :
                            currentSort.field === 'capabilities' ? a.capabilities:
                            a.details?.[currentSort.field];
                let valueB = currentSort.field === 'name' ? b[currentSort.field] :
                            currentSort.field === 'size' ? b[currentSort.field] :
                            currentSort.field === 'capabilities' ? b.capabilities:
                            b.details?.[currentSort.field];

                const comparison = compareValues(valueA, valueB, currentSort.field);
                return currentSort.direction === 'asc' ? comparison : -comparison;
            });

            modelsListContent.replaceChildren(...sortedModels.map(buildModelRow));
        }

        // Render an arbitrary nested object (model details) into the dialog as real DOM nodes.
        // Indentation is derived from depth (a number we control) — never from untrusted data —
        // and every key/value is set via textContent, so model metadata cannot inject markup.
        function buildNestedNodes(data, depth = 0) {
            const frag = document.createDocumentFragment();

            if (typeof data !== 'object' || data === null) {
                frag.appendChild(document.createTextNode(data == null ? '' : String(data)));
                return frag;
            }

            if (Array.isArray(data)) {
                data.forEach(item => {
                    const wrap = el('div', 'nested-array-item');
                    wrap.style.marginLeft = (depth * 20 + 10) + 'px';
                    wrap.appendChild(buildNestedNodes(item, depth + 1));
                    frag.appendChild(wrap);
                });
                return frag;
            }

            Object.entries(data).forEach(([key, value]) => {
                const isComplex = typeof value === 'object' && value !== null;
                const rowEl = el('div', 'nested-row');
                rowEl.style.marginLeft = (depth * 20) + 'px';

                const strong = document.createElement('strong');
                strong.textContent = key.replaceAll('_', ' ') + ':';
                rowEl.appendChild(strong);

                let displayValue = value;
                if (key === 'modified_at') displayValue = new Date(value).toString();

                if (isComplex) {
                    rowEl.appendChild(document.createElement('br'));
                    rowEl.appendChild(buildNestedNodes(displayValue, depth + 1));
                } else {
                    const isPre = displayValue != null && String(displayValue).includes('\n');
                    const valueEl = document.createElement(isPre ? 'pre' : 'span');
                    if (isPre) valueEl.style.marginLeft = '20px';
                    valueEl.textContent = displayValue == null ? '' : String(displayValue);
                    rowEl.appendChild(valueEl);
                }
                frag.appendChild(rowEl);
            });
            return frag;
        }

        function printModel(model) {
            const dialog = document.querySelector('#model-details');
            const wrapper = dialog.querySelector('#model-details-wrapper');
            wrapper.replaceChildren(buildNestedNodes(model));
            dialog.showModal();
        }

        async function refreshModels() {
            const modelsList = document.getElementById('modelsList');
            selectedModels.clear();
            
            // Reset select all checkbox
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            }
            
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                
                currentModels = models;
                displayModels(models);
                populateChatModels();
            } catch (error) {
                const errEl = el('div', 'error');
                errEl.textContent = `Failed to fetch models: ${error.message}`;
                document.getElementById('modelsListContent').replaceChildren(errEl);
            }
        }

        function toggleAllModels(checkbox) {
            const isChecked = checkbox.checked;
            currentModels.forEach(model => {
                const modelCheckbox = document.getElementById(model.name);
                if (modelCheckbox) {
                    modelCheckbox.checked = isChecked;
                    if (isChecked) {
                        selectedModels.add(model.name);
                    } else {
                        selectedModels.delete(model.name);
                    }
                }
            });
            updateBulkActionButtons();
        }

        function toggleModel(modelName) {
            const checkbox = document.getElementById(modelName);
            if (checkbox.checked) {
                selectedModels.add(modelName);
            } else {
                selectedModels.delete(modelName);
            }
            
            // Update select all checkbox state
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = currentModels.length > 0 && 
                    currentModels.every(model => selectedModels.has(model.name));
                selectAllCheckbox.indeterminate = selectedModels.size > 0 && 
                    selectedModels.size < currentModels.length;
            }
            
            updateBulkActionButtons();
        }

        function updateBulkActionButtons() {
            const updateSelectedBtn = document.getElementById('updateSelectedBtn');
            if (updateSelectedBtn) {
                updateSelectedBtn.disabled = selectedModels.size === 0;
            }
        }

        async function updateSelectedModels(event) {
            if (selectedModels.size === 0) return;
            
            const models = Array.from(selectedModels);
            const updatePromises = models.map(modelName => {
                const statusElement = document.createElement('div');
                statusElement.id = `status-${modelName}`;
                statusElement.className = 'update-status';
                const modelRow = document.getElementById(modelName).closest('.model-item');
                modelRow.querySelector('.actions-col').appendChild(statusElement);
                return updateModel(event, modelName);
            });
            
            await Promise.all(updatePromises);
            selectedModels.clear();
            updateBulkActionButtons();
            refreshModels();
        }

        async function deleteModel(event, modelName) {
            event.stopPropagation()

            if (!confirm(`Are you sure you want to delete ${modelName}?`)) {
                return;
            }

            try {
                const response = await fetch('/api/models', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ models: [modelName] })
                });
                
                const data = await response.json();
                if (data.success) {
                    refreshModels();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Failed to connect to server');
            }
        }

        async function deleteSelectedModels(event) {
            event.stopPropagation()

            if (selectedModels.size === 0) return;
            
            if (!confirm(`Are you sure you want to delete ${selectedModels.size} model(s)?`)) {
                return;
            }

            try {
                const response = await fetch('/api/models', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ models: Array.from(selectedModels) })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('Models deleted successfully');
                    refreshModels();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Failed to connect to server');
            }
        }

        function updateStatusElement(statusElement, message, isError = false) {
            statusElement.textContent = message;
            if (isError) {
                setTimeout(() => {
                    statusElement.textContent = '';
                }, 5000);
            }
        }

        function handleUpdateStatus(update, statusElement) {
            if (update.status === 'error') {
                throw new Error(update.error || 'Update failed');
            }

            switch (update.status) {
                case 'downloading':
                    const progress = ((update.completed / update.total) * 100).toFixed(1);
                    return `Downloading: ${progress}%`;
                case 'verifying digest':
                    return 'Verifying download...';
                case 'writing manifest':
                    return 'Finalizing update...';
                default:
                    return update.status;
            }
        }

        async function processUpdateStream(reader, statusElement) {
            let lastStatus = '';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const lines = new TextDecoder().decode(value).split('\n');
                
                for (const line of lines) {
                    if (!line.trim()) continue;
                    
                    try {
                        const update = JSON.parse(line);
                        const newStatus = handleUpdateStatus(update, statusElement);
                        
                        if (newStatus !== lastStatus) {
                            updateStatusElement(statusElement, newStatus);
                            lastStatus = newStatus;
                        }
                    } catch (e) {
                        if (e.message === 'Update failed') throw e;
                        console.error('Error parsing update:', e);
                    }
                }
            }
        }

        async function updateModel(event, modelName) {
            event.stopPropagation()
            if (!confirm(`Are you sure you want to update ${modelName}?`)) {
                return;
            }            
            const statusElement = document.getElementById(`status-${modelName}`);
            updateStatusElement(statusElement, 'Starting update...');
            
            try {
                const response = await fetch('/api/update-model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ modelName })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to start update');
                }

                await processUpdateStream(response.body.getReader(), statusElement);
                
                updateStatusElement(statusElement, 'Update complete');
                setTimeout(() => {
                    updateStatusElement(statusElement, '');
                    refreshModels();
                }, 2000);
                
            } catch (error) {
                console.error('Update error:', error);
                updateStatusElement(statusElement, `Error: ${error.message}`, true);
            }
        }

        async function fetchRunningModels() {
            const runningModelsContent = document.getElementById('runningModelsContent');
            try {
                const response = await fetch('/api/ps');
                const data = await response.json();
                
                if (!data.models || data.models.length === 0) {
                    const empty = el('div', 'running-model-item');
                    empty.textContent = 'No models currently running';
                    runningModelsContent.replaceChildren(empty);
                    return;
                }

                // Build each running-model card with textContent — model.name and friends are
                // metadata and must not be interpolated into innerHTML.
                const buildStat = (label, value) => {
                    const stat = el('div', 'model-stat');
                    const l = el('span', 'stat-label');
                    l.textContent = label;
                    const v = el('span', 'stat-value');
                    v.textContent = value;
                    stat.append(l, v);
                    return stat;
                };
                runningModelsContent.replaceChildren(...data.models.map(model => {
                    const card = el('div', 'running-model-item');
                    const capabilities = Array.isArray(model.capabilities) ? model.capabilities.join(', ') : '';
                    card.append(
                        buildStat('Name:', model.name),
                        buildStat('Memory:', formatSize(model.size_vram)),
                        buildStat('Parameters:', model.details?.parameter_size || 'N/A'),
                        buildStat('Capabilities:', capabilities || 'N/A'),
                        buildStat('Quantization:', model.details?.quantization_level || 'N/A')
                    );
                    return card;
                }));
            } catch (error) {
                console.error('Failed to fetch running models:', error);
                const errEl = el('div', 'running-model-item error');
                errEl.textContent = 'Failed to fetch running models';
                runningModelsContent.replaceChildren(errEl);
            }
        }

        async function pullModel() {
            const modelName = document.getElementById('modelPullInput').value.trim();
            if (!modelName) {
                alert('Please enter a model name');
                return;
            }

            const statusElement = document.getElementById('pullStatus');
            const progressText = document.getElementById('pullProgressText');
            
            statusElement.className = '';
            statusElement.textContent = 'Starting pull...';
            progressText.style.display = 'none';

            try {
                const response = await fetch('/api/pull', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model: modelName })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to start pull');
                }

                const reader = response.body.getReader();
                let lastStatus = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = new TextDecoder().decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.trim()) {
                            try {
                                const update = JSON.parse(line);

                                if (update.status === 'error') {
                                    throw new Error(update.error || 'Pull failed');
                                }

                                if (update.status === 'downloading') {
                                    progressText.style.display = 'block';
                                    progressText.textContent = `Downloading: ${formatSize(update.completed)} / ${formatSize(update.total)}`;
                                    statusElement.textContent = update.status;
                                    statusElement.className = 'success';
                                } else if (update.status !== lastStatus) {
                                    statusElement.textContent = update.status;
                                    statusElement.className = 'success';
                                    lastStatus = update.status;
                                }
                            } catch (e) {
                                if (e.message === 'Pull failed') {
                                    throw e;
                                }
                                console.error('Error parsing update:', e);
                            }
                        }
                    }
                }

                progressText.style.display = 'none';
                statusElement.textContent = 'Pull complete';
                statusElement.className = 'success';
                setTimeout(() => {
                    statusElement.textContent = '';
                    document.getElementById('modelPullInput').value = '';
                    refreshModels();
                }, 2000);

            } catch (error) {
                console.error('Pull error:', error);
                progressText.style.display = 'none';
                statusElement.textContent = `Error: ${error.message}`;
                statusElement.className = 'error';
                setTimeout(() => {
                    statusElement.textContent = '';
                }, 5000);
            }
        }

        // ---- Chat (Deep Chat web component) ----
        function populateChatModels() {
            const select = document.getElementById('chatModelSelect');
            if (!select) return;
            const previous = select.value;
            // Only models that can chat/complete (exclude e.g. embedding models). Keep models whose
            // capability data is unavailable rather than hiding them.
            const chatModels = currentModels.filter(m =>
                !m.capabilities || m.capabilities.length === 0 ||
                m.capabilities.includes('completion') || m.capabilities.includes('chat')
            );
            // Build options with createElement + value/textContent (no innerHTML) so a model name
            // containing HTML/quotes cannot inject markup.
            select.replaceChildren(...chatModels.map(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = m.name;
                return opt;
            }));
            if (previous && chatModels.some(m => m.name === previous)) {
                select.value = previous;
            }
        }

        function setupChat() {
            const chatEl = document.getElementById('chatBox');
            if (!chatEl) return;

            chatEl.connect = {
                stream: true,
                handler: async (body, signals) => {
                    const model = document.getElementById('chatModelSelect').value;
                    if (!model) {
                        signals.onResponse({ error: 'No model selected — pick a model above (connect to an endpoint that has models).' });
                        return;
                    }
                    // Deep Chat messages use { role: 'user' | 'ai', text }; map to Ollama's { role, content }
                    const messages = (body.messages || []).map(m => ({
                        role: m.role === 'ai' ? 'assistant' : (m.role || 'user'),
                        content: m.text || ''
                    }));

                    const controller = new AbortController();
                    signals.stopClicked.listener = () => controller.abort();

                    try {
                        const resp = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model, messages }),
                            signal: controller.signal
                        });

                        if (!resp.ok) {
                            let msg = `Request failed (${resp.status})`;
                            try { msg = (await resp.json()).message || msg; } catch { /* non-JSON body */ }
                            signals.onResponse({ error: msg });
                            return;
                        }

                        signals.onOpen();
                        if (!resp.body) {
                            signals.onResponse({ error: 'Server returned an empty response stream.' });
                            return;
                        }
                        const reader = resp.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let gotText = false;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || ''; // keep any partial trailing line
                            for (const line of lines) {
                                if (!line.trim()) continue;
                                let chunk;
                                try { chunk = JSON.parse(line); } catch { continue; }
                                if (chunk.error) {
                                    signals.onResponse({ error: chunk.error });
                                    signals.onClose();
                                    return;
                                }
                                if (chunk.message && chunk.message.content) {
                                    gotText = true;
                                    signals.onResponse({ text: chunk.message.content });
                                }
                            }
                        }
                        // Clean close but no content (model failed to load, empty output, or an
                        // unparseable line) -> tell the user instead of leaving a blank bubble.
                        if (!gotText) {
                            signals.onResponse({ error: 'The model returned no output. It may have failed to load — check the server logs.' });
                        }
                        signals.onClose();
                    } catch (e) {
                        if (e.name === 'AbortError') { signals.onClose(); return; }
                        signals.onResponse({ error: e.message || 'Network error' });
                    }
                }
            };

            // Dark theme to match the app
            chatEl.messageStyles = {
                default: {
                    ai: { bubble: { backgroundColor: '#2a2d34', color: '#e8e8e8' } },
                    user: { bubble: { backgroundColor: '#1f6feb', color: 'white' } }
                }
            };
            chatEl.textInput = {
                styles: { container: { backgroundColor: '#2a2d34', border: 'unset', color: '#e8e8e8' } },
                placeholder: { text: 'Message the model…', style: { color: '#9aa0a6' } }
            };
            chatEl.submitButtonStyles = {
                submit: { svg: { styles: { default: { filter: 'brightness(0) saturate(100%) invert(45%) sepia(96%) saturate(1500%) hue-rotate(199deg) brightness(97%) contrast(95%)' } } } }
            };

            // Populate now in case models loaded before deep-chat was defined
            populateChatModels();
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadEndpoints();
            fetchRunningModels();
            customElements.whenDefined('deep-chat').then(setupChat);
        });

        // Refresh running models periodically
        setInterval(fetchRunningModels, 5000);
    </script>
</body>
</html>
